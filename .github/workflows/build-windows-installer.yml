name: Build Saber Accounting Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build requirements
        run: python -m pip install -r requirements.txt

      - name: Run all tests
        run: python -m unittest discover -v -p "test_*.py"

      - name: Build standalone application (data service included)
        run: |
            pyinstaller --noconfirm --clean --onedir --windowed --noupx `
            --add-data "Assets/Saber_for_Audit_logo.png;assets" --add-data "Assets/fonts;assets/fonts" `
            --hidden-import arabic_reshaper --hidden-import bidi --hidden-import bidi.algorithm --collect-data arabic_reshaper `
            --hidden-import payroll_reports --hidden-import vat_return --hidden-import desktop_final --hidden-import desktop_brains --hidden-import ledger_reports --hidden-import desktop_dimensions --hidden-import desktop_stage3 --hidden-import ai_mapper --hidden-import ai_service --hidden-import pdf_import --hidden-import pypdf --hidden-import year_end --hidden-import lebanese_payroll --hidden-import inventory --hidden-import fixed_assets --hidden-import desktop_inventory --hidden-import desktop_v22 --hidden-import chart_extra --hidden-import invoice_calc --hidden-import tafqeet --hidden-import business_reports --hidden-import financial_projection --hidden-import financial_statements `
            --name SaberAccounting run_desktop.py

      - name: Verify the application was built
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\SaberAccounting\SaberAccounting.exe")) {
            Write-Error "PyInstaller did not produce dist\SaberAccounting\SaberAccounting.exe - check the build step above."
            exit 1
          }
          Write-Host "OK: dist\SaberAccounting\SaberAccounting.exe was produced."

      # Must succeed: the installer's "daily backups" option runs this program.
      - name: Build background backup service
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --hidden-import inventory --hidden-import chart_extra --hidden-import lebanese_accounts --hidden-import lebanese_payroll `
            --name SaberAccountingBackup backup_service.py

      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
            Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\Inno Setup 6"
          }

      - name: Create Windows installer
        run: iscc installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SaberAccountingSetup
          path: installer-output/SaberAccountingSetup.exe
          if-no-files-found: error
          retention-days: 30
